repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v18.1.8
  hooks:
  - id: clang-format
    name: clang-format (auto-fix)
    exclude: ^vendor/
    args:
    - -style=LLVM
    - -i
    types_or:
    - c
    - c++
  - id: clang-format
    name: clang-format (recheck)
    exclude: ^vendor/
    args:
    - -style=LLVM
    - --dry-run
    - -Werror
    types_or:
    - c
    - c++
- repo: https://github.com/pocc/pre-commit-hooks
  rev: v1.3.5
  hooks:
  - id: cppcheck
    exclude: \.m$
    args:
    - -Iinclude
    - --enable=warning,style,performance,portability
    - --suppress=missingIncludeSystem
    - --suppress=missingReturn
    - --suppress=constParameterPointer
    - --suppress=constParameterCallback
    - --suppress=constVariablePointer
    - --suppress=unusedStructMember
    - --suppress=variableScope
    - --suppress=knownConditionTrueFalse
    - --suppress=unreadVariable
    - --suppress=shadowVariable
    - --suppress=unusedVariable
    - --error-exitcode=1
    - --force
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.4
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format
- repo: local
  hooks:
  - id: build-compilation-db
    name: Build Compilation Database
    entry: cmake -E env --unset=GIT_INDEX_FILE --unset=GIT_DIR --unset=GIT_WORK_TREE cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    language: system
    pass_filenames: false
  - id: check-api-returns
    name: Check API Error Returns
    entry: python -c "import sys; sys.argv[0]='check_error_percolation_clang.py';
      import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_hooks/check_error_percolation_clang.py').read())"
    language: python
    additional_dependencies:
    - libclang
    types_or:
    - c
    - c++
    args:
    - --ignore-callers
    - run_*
    - test_*
    - TEST*
    - main
    - thread_task_*
    - async_task_*
    - force_depth_error
  - id: check-no-discard-void-clang
    name: Check no-discard void casts (libclang)
    entry: python -c "import sys; sys.argv[0]='check_no_discard_void_clang.py';
      import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_hooks/check_no_discard_void_clang.py').read())"
    language: python
    types_or:
    - c
    - c++
    additional_dependencies:
    - libclang
  - id: cppcheck
    name: Cppcheck
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      cppcheck
    language: python
    pass_filenames: false
    types_or:
    - c
    - c++
  - id: build-gcc
    name: Build (GCC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build gcc
    language: python
    pass_filenames: false
  - id: test-gcc
    name: Test (GCC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test gcc
    language: python
    pass_filenames: false
  - id: build-clang
    name: Build (Clang)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build clang
    language: python
    pass_filenames: false
  - id: test-clang
    name: Test (Clang)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test clang
    language: python
    pass_filenames: false
  - id: build-msvc-wine
    name: Build & Test (MSVC Wine)
    entry: python -c "import os, subprocess, shutil, sys; w = shutil.which('wineserver') or shutil.which('wine'); (print('Skipping MSVC Wine'), sys.exit(0)) if os.name == 'nt' or not w or not os.path.isdir(os.environ.get('MSVC_WINE_PATH', os.path.expanduser('~/my_msvc/opt/msvc'))) else None; [os.environ.pop(k, None) for k in ('GIT_INDEX_FILE', 'GIT_DIR', 'GIT_WORK_TREE')]; os.environ['PATH'] = os.path.dirname(os.path.realpath(w)) + os.pathsep + os.environ.get('PATH', ''); r = subprocess.run(['bash', '-c', 'export WINEPREFIX="${WINEPREFIX:-$HOME/.wine_cmultiplatform}" PARALLEL_JOBS=8 CTEST_PARALLEL_LEVEL=8; bash ~/repos/c-ci/build_msvc_wine.sh -DCMAKE_DISABLE_FIND_PACKAGE_SQLite3=ON -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON -DCMAKE_DISABLE_FIND_PACKAGE_Brotli=ON -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON; R=$?; wineserver -k9 || true; wineserver -w || true; pkill -9 -f winedevice.exe 2>/dev/null || true; exit $R']); sys.exit(r.returncode)"
    language: python
    pass_filenames: false
  - id: build-msvc
    name: Build (MSVC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build msvc
    language: python
    pass_filenames: false
  - id: test-msvc
    name: Test (MSVC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test msvc
    language: python
    pass_filenames: false
  - id: build-mingw
    name: Build (MinGW)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build mingw
    language: python
    pass_filenames: false
  - id: test-mingw
    name: Test (MinGW)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test mingw
    language: python
    pass_filenames: false
  - id: wasm-layout-assertions
    name: Wasm Layout Assertions
    entry: python -c "import os, subprocess; [os.environ.pop(k, None) for k in ('GIT_INDEX_FILE', 'GIT_DIR', 'GIT_WORK_TREE')]; os.makedirs('build_wasm', exist_ok=True); subprocess.run(['cmake', '..'], cwd='build_wasm', check=True); subprocess.run(['cmake', '--build', '.', '--target', 'cmn_tests'], cwd='build_wasm', check=True); subprocess.run(['ctest', '-C', 'Debug', '--output-on-failure', '-R', '^cmn_tests$'], cwd='build_wasm', check=True)"
    language: python
    pass_filenames: false
  - id: valgrind
    name: Valgrind (GCC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      valgrind gcc
    language: python
    pass_filenames: false
  - id: update-shields
    name: Update README Shields
    entry: python ./scripts/update-shields.py
    language: python
    additional_dependencies:
    - gcovr
    pass_filenames: false
